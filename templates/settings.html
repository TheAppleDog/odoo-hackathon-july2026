{% extends 'base.html' %}
{% block title %}Settings{% endblock %}

{% block content %}
<div class="page-card">
  <div class="page-header">
    <h1>⚙️ Settings</h1>
    <p class="muted">Adjust your preferences.</p>
  </div>
  
  <section class="settings-section">
    <h3>Language</h3>
    <div class="settings-static">English</div>
  </section>

  <section class="settings-section">
    <h3>Notifications</h3>
    <div class="settings-checkboxes">
      <label class="checkline"><input type="checkbox" checked disabled /> Email</label>
      <label class="checkline"><input type="checkbox" checked disabled /> Dashboard Alerts</label>
    </div>
  </section>

  <section class="settings-section">
    <h3>About</h3>
    <div class="settings-static">TransitOps v1.0</div>
  </section>
</div>
{% endblock %}
